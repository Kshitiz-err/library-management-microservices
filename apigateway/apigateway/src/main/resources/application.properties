spring.application.name=Api-Gateway
server.port=8088

spring.cloud.gateway.routes[0].id=CatalogServer
spring.cloud.gateway.routes[0].uri=lb://CatalogServer
spring.cloud.gateway.routes[0].predicates[0]=Path=/catalog/**,/catalog

spring.cloud.gateway.routes[1].id=fineservice
spring.cloud.gateway.routes[1].uri=lb://fineservice
spring.cloud.gateway.routes[1].predicates[0]=Path=/fine/**,/fine

spring.cloud.gateway.routes[2].id=InventoryService
spring.cloud.gateway.routes[2].uri=lb://InventoryService
spring.cloud.gateway.routes[2].predicates[0]=Path=/inventory/**,/inventory

spring.cloud.gateway.routes[3].id=IssueService
spring.cloud.gateway.routes[3].uri=lb://IssueService
spring.cloud.gateway.routes[3].predicates[0]=Path=/issue/**,/issue

spring.cloud.gateway.routes[4].id=UserService
spring.cloud.gateway.routes[4].uri=lb://UserService
spring.cloud.gateway.routes[4].predicates[0]=Path=/user-profile/**,/user-profile

spring.cloud.gateway.routes[5].id=AuthService
spring.cloud.gateway.routes[5].uri=lb://AuthService
spring.cloud.gateway.routes[5].predicates[0]=Path=/auth/**,/auth

#eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka
eureka.instance.client.service-url.default-zone=http://localhost:8761/eureka


